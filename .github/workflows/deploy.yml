name: CI/CD – Build & Deploy FastAPI via Docker + Tailscale (Auth Key)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build & push Docker image
      - name: Build and push Docker image
        run: |
          docker build -t rabin089/heritedge-backend:latest .
          docker push rabin089/heritedge-backend:latest

      # 4️⃣ Install Tailscale
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      # 5️⃣ Start tailscaled manually (NO systemd)
      - name: Start tailscaled
        run: |
          sudo mkdir -p /var/lib/tailscale /var/run/tailscale

          sudo tailscaled \
            --state=/var/lib/tailscale/tailscaled.state \
            --socket=/var/run/tailscale/tailscaled.sock \
            > ~/tailscaled.log 2>&1 &

          # Wait for socket
          for i in {1..20}; do
            if [ -S /var/run/tailscale/tailscaled.sock ]; then
              echo "tailscaled is ready"
              break
            fi
            sleep 0.5
          done

      # 6️⃣ Bring Tailscale up using AUTH KEY
      - name: Connect to Tailscale (auth key)
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=github-ci-${{ github.run_id }} \
            --accept-dns=false \
            --accept-routes=false

      # 7️⃣ Verify Tailscale connection
      - name: Verify Tailscale
        run: |
          sudo tailscale status
          sudo tailscale ping 100.115.133.57 || true

      # 8️⃣ Deploy via Tailscale SSH
      - name: Deploy on server
        run: |
          sudo tailscale ssh "${{ secrets.SSH_USER }}@100.115.133.57" << 'EOF'
            set -e

            echo "Connected via Tailscale SSH"

            docker pull rabin089/heritedge-backend:latest

            docker stop heritedge-backend || true
            docker rm heritedge-backend || true

            docker run -d \
              --name heritedge-backend \
              --restart unless-stopped \
              --network heritedge-db_default \
              --env-file /opt/heritedge/heritedge-api/.env \
              -p 8000:8000 \
              rabin089/heritedge-backend:latest

            docker image prune -f
          EOF

      # 9️⃣ Cleanup (important)
      - name: Tailscale cleanup
        if: always()
        run: |
          sudo tailscale down || true