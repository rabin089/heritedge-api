name: CI/CD Deploy via Docker + Tailscale

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build & Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            rabin089/heritedge-api:latest
            rabin089/heritedge-api:${{ github.sha }}

      # 4️⃣ Connect GitHub Runner to Tailscale
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 5️⃣ Deploy on Server via SSH
      - name: Deploy on Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          script: |
            set -e
            echo "Connected via Tailscale"

            docker pull rabin089/heritedge-api:latest

            docker stop heritedge-api || true
            docker rm heritedge-api || true

            docker run -d \
              --name heritedge-api \
              --restart unless-stopped \
              -p 3000:3000 \
              rabin089/heritedge-api:latest

            docker image prune -f
