name: CI/CD – Build & Deploy FastAPI via Docker + Tailscale

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build & Push Docker Image
      - name: Build and push Docker image
        run: |
          docker build -t rabin089/heritedge-backend:latest .
          docker push rabin089/heritedge-backend:latest

      # 4️⃣ Connect GitHub runner to Tailscale
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 5️⃣ Verify Tailscale network
      - name: Verify Tailscale connection
        run: |
          tailscale status
          ping -c 3 100.85.126.66

      # 6️⃣ Deploy on server via Tailscale SSH
      - name: Deploy on server
        run: |
          tailscale ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e

            echo "Connected via Tailscale SSH"
            docker pull rabin089/heritedge-backend:latest

            docker stop heritedge-backend || true
            docker rm heritedge-backend || true

            docker run -d \
              --name heritedge-backend \
              --restart unless-stopped \
              --network heritedge-db_default \
              --env-file /opt/heritedge/heritedge-api/.env \
              -p 8000:8000 \
              rabin089/heritedge-backend:latest

            docker image prune -f

            echo "Deployment complete."
          EOF
