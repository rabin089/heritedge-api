name: Deploy HeritEdge Backend

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/heritedge-backend:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Login to GHCR
      # -----------------------------
      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      # -----------------------------
      # Build image
      # -----------------------------
      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build -t $IMAGE_NAME .

      # -----------------------------
      # Push image
      # -----------------------------
      - name: Push Docker image
        run: |
          set -euo pipefail
          docker push $IMAGE_NAME

      # -----------------------------
      # Install cloudflared (only if you truly need it)
      # -----------------------------
      - name: Install cloudflared
        run: |
          set -euo pipefail
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      # -----------------------------
      # Configure SSH (robust version)
      # -----------------------------
      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          # Write key safely
          printf "%s" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Validate key immediately
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          # Known hosts
          ssh-keyscan -H ssh.rabindulal.com.np >> ~/.ssh/known_hosts

          # SSH config (NO proxy unless required)
          cat > ~/.ssh/config <<EOF
          Host heritedge
            HostName ssh.rabindulal.com.np
            User rabin089
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
            ServerAliveInterval 60
          EOF

      # -----------------------------
      # Test SSH connection
      # -----------------------------
      - name: Test SSH connection
        run: |
          set -euo pipefail
          ssh heritedge "echo 'SSH OK' && whoami"

      # -----------------------------
      # Deploy on server
      # -----------------------------
      - name: Deploy application
        run: |
          set -euo pipefail

          ssh heritedge << 'EOF'
            set -euo pipefail

            cd ~/infra/heritedge

            echo "Pulling latest images..."
            docker compose pull

            echo "Restarting containers..."
            docker compose up -d --remove-orphans

            echo "Cleaning old images..."
            docker image prune -f

            echo "Current running containers:"
            docker ps

            echo "Deployment completed successfully"
          EOF