name: CI/CD – Build & Deploy FastAPI via Docker + Tailscale

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build & Push Docker Image
      - name: Build and push Docker image
        run: |
          docker build -t rabin089/heritedge-backend:latest .
          docker push rabin089/heritedge-backend:latest

      # 4️⃣ Connect GitHub runner to Tailscale (with tag for ACL permission)\
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci-runner                  # Enforces the tag on the CI node
          hostname: github-ci-${{ github.run_id }}  # Optional, for easy spotting in console
          # ping: rabindulal                   # Optional: action can auto-ping to wait for connectivity

# Verification step (improved)
      - name: Verify Tailscale connection
        run: |
          tailscale status --json | jq .         # Shows full details including tags
          tailscale ping rabindulal
          echo "If ping works via DERP/direct, SSH policy is the blocker"

# Deploy step (add -T for non-interactive)
      - name: Deploy on server
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          tailscale ssh -T ${{ secrets.SERVER_USER }}@rabindulal << 'EOF'
            set -euo pipefail
            echo "Deploying from CI node: $(tailscale status --json | jq -r '.Self.HostName')"
            # ... your docker pull/stop/rm/run/prune commands unchanged ...
          EOF