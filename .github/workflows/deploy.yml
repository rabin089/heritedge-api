name: Deploy HeritEdge Backend

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/heritedge-backend:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # -----------------------------------
      # Checkout repository
      # -----------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------
      # Login to GHCR
      # -----------------------------------
      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # -----------------------------------
      # Build Docker image
      # -----------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME \
            .

      # -----------------------------------
      # Push Docker image
      # -----------------------------------
      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME

      # -----------------------------------
      # Install cloudflared
      # -----------------------------------
      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared-linux-amd64.deb

      # -----------------------------------
      # Configure SSH
      # -----------------------------------
      - name: Configure SSH
        shell: bash
        run: |
          set -eu

          mkdir -p ~/.ssh

          cat << 'EOF' > ~/.ssh/id_ed25519
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF

          # Remove Windows CRLF characters
          sed -i 's/\r$//' ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          # Validate SSH key
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          # Add known host
          ssh-keyscan ssh.rabindulal.com.np >> ~/.ssh/known_hosts

          # SSH config
          cat << 'EOF' > ~/.ssh/config
          Host heritedge
            HostName ssh.rabindulal.com.np
            User rabin089
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h
            ServerAliveInterval 60
          EOF

      # -----------------------------------
      # Debug SSH
      # -----------------------------------
      - name: Debug SSH key
        run: |
          file ~/.ssh/id_ed25519
          wc -l ~/.ssh/id_ed25519
          head -n 1 ~/.ssh/id_ed25519

      # -----------------------------------
      # Test SSH connection
      # -----------------------------------
      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=yes heritedge "echo SSH connection successful"

      # -----------------------------------
      # Deploy application
      # -----------------------------------
      - name: Deploy application
        run: |
          ssh heritedge << 'EOF'
            set -e

            cd ~/infra/heritedge

            echo "Pulling latest images..."
            docker compose pull

            echo "Restarting containers..."
            docker compose up -d --remove-orphans

            echo "Cleaning old images..."
            docker image prune -f

            echo "Running containers:"
            docker ps

            echo "Deployment completed successfully"
          EOF