name: Deploy HeritEdge Backend

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/heritedge-backend:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Login to GHCR
      # -----------------------------
      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # -----------------------------
      # Build Docker image
      # -----------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME \
            .

      # -----------------------------
      # Push Docker image
      # -----------------------------
      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME

      # -----------------------------
      # Install cloudflared
      # -----------------------------
      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared-linux-amd64.deb

      # -----------------------------
      # Configure SSH
      #
      # -----------------------------
      - name: Configure SSH
        run: |
          set -eu

          mkdir -p ~/.ssh

          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          ssh-keyscan ssh.rabindulal.com.np >> ~/.ssh/known_hosts

          cat > ~/.ssh/config << 'EOF'
          Host heritedge
            HostName ssh.rabindulal.com.np
            User rabin089
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h
            ServerAliveInterval 60
          EOF

      # -----------------------------
      # Test SSH connection
      # -----------------------------
      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=yes heritedge "echo SSH connection successful"

      # -----------------------------
      # Deploy on server
      # -----------------------------
      - name: Deploy application
        run: |
          ssh heritedge << 'EOF'
            set -e

            cd ~/infra/heritedge

            echo "Pulling latest images..."
            docker compose pull

            echo "Restarting containers..."
            docker compose up -d --remove-orphans

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Running containers:"
            docker ps

            echo "Deployment completed successfully"
          EOF