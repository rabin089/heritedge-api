name: Deploy via Tailscale SSH

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Verify Tailscale connection
        run: |
          tailscale status
          ping -c 3 rabindulal

      - name: Deploy backend
        run: |
          tailscale ssh rabin089@rabindulal << 'EOF'
            set -e
            echo "Connected via Tailscale SSH"

            docker pull rabin089/heritedge-backend:latest

            docker stop heritedge-backend || true
            docker rm heritedge-backend || true

            docker run -d \
              --name heritedge-backend \
              --restart unless-stopped \
              --network heritedge-db_default \
              --env-file /opt/heritedge/heritedge-api/.env \
              -p 8000:8000 \
              rabin089/heritedge-backend:latest

            docker image prune -f
          EOF
