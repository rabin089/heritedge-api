name: Deploy HeritEdge Backend

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/heritedge-backend:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/heritedge-backend:latest

      - name: Install cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan ssh.rabindulal.com.np >> ~/.ssh/known_hosts

          cat > ~/.ssh/config << EOF
          Host heritedge
            HostName ssh.rabindulal.com.np
            User rabin089
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Test SSH connection
        run: |
          ssh heritedge "echo SSH connection successful"

      - name: Deploy on server
        run: |
          ssh heritedge "
            cd ~/infra/heritedge &&
            docker compose pull &&
            docker compose up -d --remove-orphans &&
            docker image prune -f &&
            docker ps | grep heritedge-backend
          "