version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: heritedge_local_db
    environment:
      POSTGRES_DB: heritage-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"  # Maps localhost:5433 to container:5432
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heritage-db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_local_data:
